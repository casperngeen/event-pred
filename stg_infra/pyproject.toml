[build-system]
requires = ["setuptools>=64.0.0, <75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stg"
version = "0.3.0"
description = "Spatio-Temporal Graph infrastructure for event prediction markets"
requires-python = ">=3.9"
dependencies = [
    "polars>=0.20",
    "numpy>=1.22",
    "networkx>=3.0",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
# semantic-topic edges were removed in the series-level refactor; keep the
# dependency available for anyone reviving them from git history.
semantic = ["sentence-transformers>=5.3.0"]
models = ["torch>=2.0"]           # AGCRN training study (stg/models/)
dev = ["pytest>=7.0", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
